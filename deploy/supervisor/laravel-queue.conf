[program:plexusbiz-queue]
process_name=%(program_name)s
command=/usr/bin/php /var/www/laravel/PlexusBiz-Automate/artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/var/www/laravel/PlexusBiz-Automate
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/supervisor/plexusbiz-queue.log
